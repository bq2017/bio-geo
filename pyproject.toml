[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-geo-tagging"
version = "0.1.0"
description = "高中生物地理知识点打标项目"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.0",
    "openpyxl>=3.1",
    "tqdm>=4.66",
]

[project.scripts]
label-definition-generate = "bio_geo_tagging.label_definition_validation:generate_main"
label-definition-compare = "bio_geo_tagging.label_definition_validation:compare_main"
label-definition-review = "bio_geo_tagging.label_definition_validation:review_main"
question-info-merge = "bio_geo_tagging.question_info_merge:main"
question-tagging-units = "bio_geo_tagging.question_tagging_units:main"
question-tagging-sample = "bio_geo_tagging.sample_tagging_groups:main"
question-label-candidates = "bio_geo_tagging.call1_candidate_retrieval:main"
question-label-candidates-evaluate = "bio_geo_tagging.call1_candidate_evaluation:main"
question-label-match = "bio_geo_tagging.question_label_match:main"
question-label-analysis = "bio_geo_tagging.label_match_analysis:main"
question-label-diagnose = "bio_geo_tagging.label_definition_diagnosis:main"
label-retrieval-texts = "bio_geo_tagging.build_retrieval_texts:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

